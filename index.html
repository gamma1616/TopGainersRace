<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 기기에서 화면이 깨지지 않고 딱 맞게 보이도록 하는 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔥 실시간 국내 주식 달리기 시합</title>
    <!-- ECharts 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #header {
            margin-top: 15px;
            text-align: center;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }
        #header h1 {
            margin: 0;
            color: #ff4757;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }
        #header p {
            color: #aaaaaa;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        #chart-container {
            width: 65vw; /* 전체 폭을 약 30% 줄임 */
            height: 85vh; 
            margin-top: 5px;
        }

        /* 스마트폰 세로 화면일 때 설정 */
        @media (max-width: 600px) {
            #header h1 { font-size: 1.3rem; }
            #header p { font-size: 0.8rem; }
            #chart-container { 
                width: 85vw; /* 모바일은 너무 좁아지지 않게 85% 유지 */
                height: 80vh; 
            }
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>🏃‍♂️ 코스피/코스닥 상승률 랭킹 레이스</h1>
        <p>실시간으로 가장 뜨거운 종목들의 달리기 시합입니다!</p>
        <p id="current-time" style="color: #00d2ff; font-weight: bold; font-size: 1.1rem; margin-top: 5px;"></p>
        <div id="visitor-container" style="font-size: 0.85rem; color: #888; margin-top: 8px;">
            오늘: <span id="today-visitors" style="color: #ff4757; font-weight: bold;">0</span>명 | 
            누적: <span id="total-visitors" style="color: #ffffff; font-weight: bold;">0</span>명
        </div>
    </div>

    <!-- 차트가 그려질 도화지 -->
    <div id="chart-container"></div>

    <script>
        // 현재 시각을 업데이트하는 함수
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const timeString = `${year}년 ${month}월 ${day}일 ${hours}:${minutes}:${seconds}`;
            document.getElementById('current-time').innerText = timeString;
        }
        
        // 매 초마다 시계 업데이트
        updateClock();
        setInterval(updateClock, 1000);

        const chartDom = document.getElementById('chart-container');
        const myChart = echarts.init(chartDom, 'dark', { renderer: 'canvas' });

        const colors = [
            '#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff6b81', 
            '#eccc68', '#ff7f50', '#a4b0be', '#5352ed', '#ff9f43'
        ];

        function getColorForStock(stockName) {
            let hash = 0;
            for (let i = 0; i < stockName.length; i++) {
                hash = stockName.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        // 모바일 여부와 가로/세로 상태를 판단하여 설정을 조절합니다.
        function getChartConfig() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const isMobile = width < 600;
            const isLandscape = width > height && height < 500; // 가로 모드 감지

            if (isLandscape) {
                // 가로 모드: 높이가 낮으므로 종목 수를 줄여 쾌적하게 보여줌
                return {
                    isMobile: true,
                    gridLeft: 110,
                    gridRight: 50,
                    fontSize: 12,
                    maxBars: 7 // 상위 8개만 표시
                };
            } else if (isMobile) {
                // 세로 모드 모바일
                return {
                    isMobile: true,
                    gridLeft: 85,
                    gridRight: 40,
                    fontSize: 11,
                    maxBars: 14 // 상위 15개 표시
                };
            } else {
                // PC 또는 태블릿
                return {
                    isMobile: false,
                    gridLeft: 130,
                    gridRight: 60,
                    fontSize: 16,
                    maxBars: 29 // 상위 30개 표시
                };
            }
        }

        let config = getChartConfig();

        const option = {
            backgroundColor: 'transparent',
            grid: {
                top: 10,
                bottom: 20,
                left: config.gridLeft,
                right: config.gridRight
            },
            xAxis: {
                max: 'dataMax',
                axisLabel: {
                    formatter: '{value}%',
                    color: '#aaaaaa'
                },
                splitLine: { show: true, lineStyle: { color: '#333', type: 'dashed' } }
            },
            yAxis: {
                type: 'category',
                inverse: true, 
                max: config.maxBars,       
                axisLabel: {
                    show: true,
                    fontSize: config.fontSize,
                    color: '#ffffff',
                    fontWeight: 'bold'
                },
                animationDuration: 300,
                animationDurationUpdate: 300
            },
            series: [{
                realtimeSort: true, 
                name: '상승률',
                type: 'bar',
                data: [],
                label: {
                    show: true,
                    position: 'right',
                    valueAnimation: true,
                    formatter: function(params) {
                        return params.value.toFixed(2) + '%';
                    },
                    color: '#ffffff',
                    fontSize: config.fontSize - 2,
                    fontWeight: 'bold'
                },
                itemStyle: {
                    borderRadius: [0, 10, 10, 0]
                }
            }],
            animationDuration: 0,
            animationDurationUpdate: 3000, 
            animationEasing: 'linear',
            animationEasingUpdate: 'linear'
        };

        myChart.setOption(option);

        // 캐싱된 데이터를 가져오므로 백엔드 서버가 아주 빠르고 가볍게 응답합니다.
        async function fetchAndUpdateData() {
            try {
                const response = await fetch('/api/data');
                const json = await response.json();
                
                if (json.status === 'success') {
                    // 방문자 수 업데이트
                    if (json.visitors) {
                        document.getElementById('today-visitors').innerText = json.visitors.today.toLocaleString();
                        document.getElementById('total-visitors').innerText = json.visitors.total.toLocaleString();
                    }

                    const chartData = json.data.map(item => {
                        return {
                            value: item.rate, 
                            name: item.name,  
                            itemStyle: { color: getColorForStock(item.name) }
                        };
                    });
                    
                    // 종목 이름들만 추출하여 Y축 이름표로 설정합니다.
                    const stockNames = json.data.map(item => item.name);
                    
                    myChart.setOption({
                        yAxis: {
                            data: stockNames
                        },
                        series: [{
                            data: chartData
                        }]
                    });
                }
            } catch (error) {
                console.error("데이터 가져오기 실패:", error);
            }
        }

        fetchAndUpdateData();
        // 화면도 3초마다 데이터를 달라고 조릅니다.
        // 백엔드는 5초마다 API에서 가져온 데이터를 쥐고 있으면서, 요청이 올 때마다 쥐고 있는 것만 바로 줍니다.
        setInterval(fetchAndUpdateData, 3000);

        // 폰을 돌리거나 창 크기를 조절할 때 차트 설정을 다시 맞춥니다.
        window.addEventListener('resize', function() {
            config = getChartConfig();
            myChart.setOption({
                grid: {
                    left: config.gridLeft,
                    right: config.gridRight
                },
                yAxis: {
                    max: config.maxBars,
                    axisLabel: { fontSize: config.fontSize }
                },
                series: [{
                    label: { fontSize: config.fontSize - 2 }
                }]
            });
            myChart.resize();
        });
    </script>
</body>
</html>
